<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <title>운영 관리 | 제주 글로벌 콘텐츠 포럼</title>
  <link rel="stylesheet" href="assets/css/design-system.css">
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/vendor/remixicon/remixicon-subset.css">
  <style>
    /* 관리자 전용 화면. 공개 페이지 빌드 파이프라인과 분리해 여기 둔다. */
    /* 아래에서 display를 직접 지정하는 패널들이 리셋의 [hidden] 규칙을
       덮어쓰지 않도록, hidden이 항상 이기게 못박는다. */
    [hidden] { display: none !important; }
    .admin-main { max-width: 1240px; margin: 0 auto; padding: 120px 24px 96px; }
    .admin-login { max-width: 400px; margin: 160px auto 96px; padding: 0 24px; display: grid; gap: var(--space-16); }
    .admin-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: var(--space-32); }
    .admin-tabs { display: flex; gap: 8px; flex-wrap: wrap; }
    .admin-tabs button { padding: 8px 18px; border: 1px solid var(--color-border-muted); border-radius: var(--radius-pill); background: var(--color-white); font-weight: var(--font-weight-bold); }
    .admin-tabs button.is-active { background: var(--color-action-secondary); border-color: var(--color-action-secondary); color: var(--color-white); }
    .admin-bar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: var(--space-16); }
    .admin-bar .ui-input { max-width: 260px; }
    .admin-bar select.ui-input { max-width: 220px; }
    .admin-count { margin-left: auto; color: var(--color-neutral-600); font-size: var(--font-size-14); }
    .admin-table-wrap { overflow-x: auto; border: 1px solid var(--color-border-muted); border-radius: var(--radius-md); background: var(--color-white); }
    .admin-table { width: 100%; border-collapse: collapse; font-size: var(--font-size-14); min-width: 900px; }
    .admin-table th, .admin-table td { padding: 10px 14px; border-bottom: 1px solid var(--color-border-muted); text-align: left; vertical-align: top; white-space: nowrap; }
    .admin-table td.wrap { white-space: normal; min-width: 220px; }
    .admin-table thead th { background: var(--color-bg-soft); font-weight: var(--font-weight-extrabold); position: sticky; top: 0; }
    .admin-badge { display: inline-block; padding: 2px 10px; border-radius: var(--radius-pill); font-size: 12px; font-weight: var(--font-weight-extrabold); }
    .admin-badge.ok { background: #e5f1eb; color: #1c6549; }
    .admin-badge.off { background: #faebea; color: #b32a27; }
    .admin-mini { padding: 4px 12px; font-size: 12px; border-radius: var(--radius-pill); border: 1px solid var(--color-border-muted); background: var(--color-white); }
    .admin-mini:hover { border-color: var(--color-action-secondary); color: var(--color-action-secondary); }
    .admin-mini.attend { white-space: nowrap; }
    .admin-mini.attend.on { background: #1c6549; border-color: #1c6549; color: #fff; }
    @media (hover: hover) { .admin-mini.attend.on:hover { background: #b32a27; border-color: #b32a27; } }
    .admin-mini[disabled] { opacity: .5; }
    /* 좁은 화면 카드 목록 */
    .admin-cards { display: grid; gap: 10px; padding: 10px; }
    .admin-card { padding: 14px 16px; border: 1px solid var(--color-border-muted); border-radius: var(--radius-md); background: var(--color-white); }
    .admin-card.is-off { opacity: .6; }
    .admin-card header { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .admin-card header strong { font-size: var(--font-size-18); }
    .admin-card header .attend { margin-left: auto; padding: 8px 16px; font-size: var(--font-size-14); }
    .admin-card h4 { margin: 0 0 4px; font-size: var(--font-size-16); }
    .admin-card h4 small { font-weight: normal; color: var(--color-text-muted); font-size: var(--font-size-14); }
    .admin-card p { margin: 0 0 2px; font-size: var(--font-size-15); }
    .admin-card p a { color: var(--color-action-primary); text-decoration: underline; }
    .admin-card .muted { color: var(--color-text-muted); font-size: var(--font-size-13); word-break: break-all; }
    .admin-card .inquiry { margin-top: 6px; color: var(--color-text-soft); font-size: var(--font-size-14); white-space: pre-wrap; }
    .admin-card footer { display: flex; gap: 8px; margin-top: 10px; }
    .admin-card footer:empty { display: none; }
    @media (max-width: 900px) { .admin-table-wrap { border: 0; background: transparent; } }
    .print-head { display: none; }
    /* 인쇄: 표만. 기관 부스용 일정표·사무국 출석 명단·기관별 현황 격자 모두 같은 규칙. */
    @media print {
      @page { size: A4 landscape; margin: 12mm; }
      body { background: #fff; }
      #site-header, #site-footer, .admin-head, .admin-tabs, .admin-bar, [data-logout], .admin-login, .toast, dialog { display: none !important; }
      .admin-page, .main-inner, .admin-main { padding: 0 !important; margin: 0 !important; max-width: none !important; }
      .admin-main > div { margin-top: 0 !important; }
      .print-head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; margin: 0 0 8mm; padding-bottom: 3mm; border-bottom: 2px solid #111; }
      .print-head h2 { margin: 0; font-size: 16pt; }
      .print-head span { font-size: 9pt; color: #555; }
      .admin-table-wrap { overflow: visible !important; border: 0 !important; box-shadow: none !important; background: transparent !important; }
      .admin-table { min-width: 0 !important; width: 100% !important; font-size: 9pt !important; }
      .admin-table th, .admin-table td { padding: 4px 6px !important; white-space: normal !important; border-bottom: 1px solid #bbb !important; }
      .admin-table thead th { position: static !important; background: #eee !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .admin-table tr { break-inside: avoid; }
      .admin-table .admin-mini, .admin-table [data-download], .admin-table [data-cancel] { display: none !important; }
      .admin-table .admin-mini.attend { display: inline-block !important; border: 1px solid #111 !important; background: #fff !important; color: #111 !important; }
      .admin-table .admin-mini.attend.on { background: #111 !important; color: #fff !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .admin-badge { border: 1px solid #999 !important; background: #fff !important; color: #111 !important; }
      .admin-cards { display: none !important; }
      .sum-rate .bar { border: 1px solid #999; }
      .sum-rate .bar i { background: #111 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .slot-wrap { break-before: page; }
      .slot-grid { overflow: visible !important; grid-template-columns: 140px repeat(var(--slots), 14px) !important; }
      .slot-grid .c { border: 1px solid #bbb; }
      .slot-grid .c.on { background: #111 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .ov-tiles, .ov-grid { break-inside: avoid; }
    }
    .admin-error { color: #b32a27; font-size: var(--font-size-14); min-height: 20px; }
    .admin-empty { padding: 48px; text-align: center; color: var(--color-neutral-500); }

    /* ── 현황 대시보드 ── */
    .ov-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 24px; }
    .ov-tile { padding: 18px 20px; border: 1px solid var(--color-border-muted); border-radius: var(--radius-md); background: var(--color-white); }
    .ov-tile small { display: block; color: var(--color-neutral-500); font-size: 12px; font-weight: var(--font-weight-extrabold); letter-spacing: .04em; }
    .ov-tile strong { display: block; margin-top: 6px; font-size: 30px; line-height: 1.1; font-weight: var(--font-weight-black); font-variant-numeric: tabular-nums; }
    .ov-tile strong em { font-style: normal; font-size: 15px; color: var(--color-neutral-500); font-weight: var(--font-weight-bold); margin-left: 4px; }
    .ov-tile p { margin: 8px 0 0; font-size: 13px; color: var(--color-neutral-600); }
    .ov-tile.warn strong { color: var(--color-action-secondary); }
    .ov-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
    .ov-card { padding: 18px 20px; border: 1px solid var(--color-border-muted); border-radius: var(--radius-md); background: var(--color-white); }
    .ov-card h3 { margin: 0 0 14px; font-size: 15px; font-weight: var(--font-weight-black); }
    .ov-rows { display: grid; gap: 8px; }
    .ov-row { display: grid; grid-template-columns: 96px 1fr 64px; gap: 10px; align-items: center; font-size: 13px; }
    .ov-row .bar { height: 10px; border-radius: 5px; background: var(--color-bg-soft); overflow: hidden; }
    .ov-row .bar i { display: block; height: 100%; background: var(--color-action-secondary); border-radius: 5px; }
    .ov-row .num { text-align: right; font-variant-numeric: tabular-nums; color: var(--color-neutral-600); }
    .ov-days { display: flex; align-items: flex-end; gap: 6px; height: 96px; padding-top: 6px; }
    .ov-day { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; font-size: 11px; color: var(--color-neutral-500); height: 100%; }
    .ov-day i { display: block; width: 100%; max-width: 36px; background: var(--color-action-secondary); border-radius: 4px 4px 0 0; min-height: 2px; }
    .ov-day b { font-variant-numeric: tabular-nums; color: var(--color-text-primary); }
    .ov-note { margin: 14px 0 0; font-size: 12px; color: var(--color-neutral-500); }

    /* ── 기관별 현황: 예약률 바 + 시간대 격자 ── */
    .sum-rate { display: inline-grid; grid-template-columns: 84px auto; gap: 8px; align-items: center; }
    .sum-rate .bar { height: 8px; border-radius: 4px; background: var(--color-bg-soft); overflow: hidden; }
    .sum-rate .bar i { display: block; height: 100%; background: var(--color-action-secondary); }
    .slot-wrap { margin-top: 20px; padding: 18px 20px; border: 1px solid var(--color-border-muted); border-radius: var(--radius-md); background: var(--color-white); overflow-x: auto; }
    .slot-wrap h3 { margin: 0 0 4px; font-size: 15px; font-weight: var(--font-weight-black); }
    .slot-wrap p { margin: 0 0 14px; font-size: 12px; color: var(--color-neutral-500); }
    .slot-grid { display: grid; grid-template-columns: 168px repeat(var(--slots), 22px); gap: 3px; align-items: center; min-width: max-content; }
    .slot-grid .lbl { font-size: 12px; font-weight: var(--font-weight-bold); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 8px; }
    .slot-grid .hd { font-size: 9px; color: var(--color-neutral-500); text-align: center; writing-mode: vertical-rl; transform: rotate(180deg); height: 38px; font-variant-numeric: tabular-nums; }
    .slot-grid .c { width: 22px; height: 22px; border-radius: 4px; background: var(--color-bg-soft); }
    .slot-grid .c.on { background: var(--color-action-secondary); }
    .slot-grid .c.brk { background: repeating-linear-gradient(45deg, var(--color-bg-soft), var(--color-bg-soft) 3px, var(--color-border-muted) 3px, var(--color-border-muted) 5px); }
    .slot-legend { display: flex; gap: 16px; margin-top: 12px; font-size: 12px; color: var(--color-neutral-600); }
    .slot-legend span::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -2px; background: var(--color-bg-soft); }
    .slot-legend span.on::before { background: var(--color-action-secondary); }
    .slot-legend span.brk::before { background: repeating-linear-gradient(45deg, var(--color-bg-soft), var(--color-bg-soft) 3px, var(--color-border-muted) 3px, var(--color-border-muted) 5px); }
    @media (max-width: 768px) { .ov-grid { grid-template-columns: 1fr; } .ov-row { grid-template-columns: 80px 1fr 56px; } }
    body.jgcf-admin { background: var(--color-bg-soft); }
  </style>
</head>
<body class="jgcf-admin" data-page="admin">
  <main>
    <section class="admin-login" data-login-panel>
      <div>
        <p class="section-kicker">JGCF 2026 Admin</p>
        <h1 class="side-title">운영 관리 로그인</h1>
      </div>
      <form data-login-form>
        <div style="display:grid;gap:12px">
          <label class="form-field"><span class="form-label">메일 주소</span>
            <input class="ui-input" type="email" name="email" autocomplete="username" required></label>
          <label class="form-field"><span class="form-label">비밀번호</span>
            <input class="ui-input" type="password" name="password" autocomplete="current-password" required></label>
          <p class="admin-error" data-login-error></p>
          <button class="ui-button coral" type="submit">로그인</button>
        </div>
      </form>
    </section>

    <section class="admin-main" data-admin-panel hidden>
      <div class="admin-head">
        <div>
          <p class="section-kicker">JGCF 2026 Admin</p>
          <h1 class="side-title">예약·신청 관리</h1>
        </div>
        <div style="display:flex;gap:8px;align-items:center">
          <span data-admin-email style="color:var(--color-neutral-600);font-size:14px"></span>
          <a class="ui-button ghost" href="/docs" target="_blank" rel="noopener">가이드</a>
          <button class="ui-button secondary" type="button" data-logout>로그아웃</button>
        </div>
      </div>

      <div class="admin-tabs" role="tablist">
        <button type="button" class="is-active" data-tab="overview">현황</button>
        <button type="button" data-tab="reservations">밋업 예약</button>
        <button type="button" data-tab="registrations">행사 참가신청</button>
        <button type="button" data-tab="summary">기관별 현황</button>
      </div>

      <div style="margin-top:24px">
        <div class="admin-bar">
          <input class="ui-input" type="search" placeholder="검색 (기업·담당자·연락처·번호)" data-search>
          <select class="ui-input" data-filter-company hidden><option value="">전체 상담기관</option></select>
          <select class="ui-input" data-filter-status hidden>
            <option value="">전체 상태</option>
            <option value="confirmed">예약 확정</option>
            <option value="cancelled">예약 취소</option>
            <option value="attended">출석 완료</option>
            <option value="absent">미도착 (확정인데 출석 전)</option>
          </select>
          <button class="ui-button secondary" type="button" data-refresh><i class="ri-arrow-right-line" aria-hidden="true"></i>새로고침</button>
          <button class="ui-button secondary" type="button" data-csv>CSV 내려받기</button>
          <button class="ui-button secondary" type="button" data-print>인쇄</button>
          <span class="admin-count" data-count></span>
        </div>
        <div class="print-head" data-print-head aria-hidden="true"></div>
        <div class="admin-table-wrap"><div data-table-mount></div></div>
      </div>
    </section>
  </main>

  <dialog class="dialog-backdrop" data-admin-cancel-dialog aria-labelledby="admin-cancel-title">
    <div class="ui-dialog">
      <h2 id="admin-cancel-title">이 예약을 취소할까요?</h2>
      <p data-cancel-target></p>
      <div class="dialog-actions">
        <button class="ui-button secondary" type="button" data-dialog-close>닫기</button>
        <button class="ui-button coral" type="button" data-confirm-cancel>취소 확정</button>
      </div>
    </div>
  </dialog>

  <script src="assets/js/data.js" defer></script>
  <script src="assets/js/supabaseConfig.js" defer></script>
  <script src="assets/js/admin.js" defer></script>
</body>
</html>
