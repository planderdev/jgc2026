<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
  <title>예약 조회/취소 | 제주 글로벌 콘텐츠 포럼</title>
  <meta name="description" content="예약번호와 담당자 연락처로 비즈니스 밋업 예약 내역을 조회하고 취소할 수 있습니다.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="JGCF 2026">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:title" content="예약 조회/취소 | 제주 글로벌 콘텐츠 포럼">
  <meta property="og:description" content="예약번호와 담당자 연락처로 비즈니스 밋업 예약 내역을 조회하고 취소할 수 있습니다.">
  <meta property="og:url" content="https://jgc2026.vercel.app/meetup/confirm">
  <meta property="og:image" content="https://jgc2026.vercel.app/assets/images/og/og-default.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="../assets/css/design-system.css">
  <link rel="stylesheet" href="../assets/css/styles.css">
  <link rel="stylesheet" href="../assets/vendor/remixicon/remixicon-subset.css">
</head>
<body data-page="meetup-confirm">
  <div id="site-header"></div>
  <main class="reserve-page">
    <div class="main-inner">
      <div class="section-heading" style="margin-bottom:var(--space-32)">
        <div>
          <p class="section-kicker">Lookup</p>
          <h1 class="side-title">비즈밋업 예약 조회/취소</h1>
        </div>
        <a class="ui-button secondary" href="reserve"><i class="ri-add-line" aria-hidden="true"></i>새 예약</a>
      </div>
      <div class="lookup-layout">
        <form class="lookup-card" data-lookup-form>
          <label class="form-field">
            <span class="form-label">예약번호</span>
            <input class="ui-input" name="reservationNumber" placeholder="JGCF-2026-ABC123" required>
          </label>
          <label class="form-field" style="margin-top:var(--space-16)">
            <span class="form-label">담당자 연락처</span>
            <input class="ui-input" name="phone" type="tel" placeholder="010-0000-0000" required>
          </label>
          <button class="ui-button coral" type="submit" style="margin-top:var(--space-24)"><i class="ri-search-line" aria-hidden="true"></i>조회하기</button>
        </form>
        <section class="lookup-result" data-lookup-result tabindex="-1">
          <p class="prose-block">예약번호와 신청 시 입력한 담당자 연락처를 입력하면 예약 상태를 확인할 수 있습니다.</p>
        </section>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>

  <dialog class="dialog-backdrop" data-cancel-dialog aria-labelledby="cancel-title">
    <div class="ui-dialog">
      <h2 id="cancel-title">예약을 취소할까요?</h2>
      <p>취소 후에는 같은 시간대가 다른 참가자에게 열릴 수 있습니다.</p>
      <div class="dialog-actions">
        <button class="ui-button secondary" type="button" data-dialog-close>닫기</button>
        <button class="ui-button coral" type="button" data-confirm-cancel>취소 확정</button>
      </div>
    </div>
  </dialog>

  <script src="../assets/js/data.js" defer></script>
  <script src="../assets/js/supabaseConfig.js" defer></script>
  <script src="../assets/js/reservationService.js" defer></script>
  <script src="../assets/js/common.js" defer></script>
  <script src="../assets/js/meetup.js" defer></script>
</body>
</html>
